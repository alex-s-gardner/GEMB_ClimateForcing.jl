# EarthData.jl is pinned to `main`, NOT taken from the General registry, and this is
# load-bearing rather than a preference for newer code. The registered v0.1.0 is the 2023
# tree: it cannot parse a present-day CMR response at all (`MethodError: Cannot convert an
# object of type Int64 to an object of type String` out of the UMM-G schema on any real
# query) and predates `urls`/`collections`. The July 2026 work on `main` fixes both but is
# untagged, so there is no released version that works.
#
# Consequences, deliberately accepted:
#   - This package cannot be registered in General until upstream tags a release. Ask on
#     https://github.com/evetion/EarthData.jl/issues/18, then drop this block and let the
#     [compat] entry above resolve normally.
#   - An upstream force-push to `main` breaks re-resolution (existing checkouts are fine).
#   - A version bump on `main` breaks re-resolution until the [compat] bound above admits it:
#     the bound has to cover whatever `main` currently calls itself, or Pkg reports
#     "Unsatisfiable requirements detected for package EarthData — no versions left". `main`
#     became 0.2.0 on 2026-08-18, hence the "0.1, 0.2" above. The three names this package
#     uses — `request`, `granule_url`, `Granules.UMM_G` — are unchanged across that bump.
#
# Do NOT "simplify" by deleting this block: Pkg would silently resolve the broken v0.1.0 and
# every MODIS granule query would fail in the schema parser, far from the cause.
[sources]
EarthData = {url = "https://github.com/evetion/EarthData.jl", rev = "main"}

